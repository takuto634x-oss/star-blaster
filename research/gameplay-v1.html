<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STAR BLASTER — プレイ画面</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    #gameWrapper { position: relative; width: 480px; height: 680px; }
    canvas {
      display: block;
      border: 1px solid rgba(100, 200, 255, 0.2);
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.15), 0 0 80px rgba(50, 100, 200, 0.1);
    }
    #ui {
      position: absolute; top: 0; left: 0; right: 0;
      padding: 14px 20px;
      display: flex; justify-content: space-between; align-items: flex-start;
      pointer-events: none; z-index: 10;
    }
    .ui-block { display: flex; flex-direction: column; gap: 4px; }
    .ui-label { font-size: 10px; letter-spacing: 2px; color: rgba(100,180,255,0.6); text-transform: uppercase; }
    .ui-value { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(100,200,255,0.8); }
    .level-badge {
      position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center;
    }
    .level-label { font-size: 10px; letter-spacing: 2px; color: rgba(100,180,255,0.6); }
    .level-value { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 10px rgba(100,200,255,0.8); }
    .lives-icons { display: flex; gap: 5px; margin-top: 2px; }
    .life-icon {
      width: 14px; height: 14px;
      background: linear-gradient(135deg,#00ccff,#0066ff);
      clip-path: polygon(50% 0%,100% 100%,80% 75%,50% 90%,20% 75%,0% 100%);
      filter: drop-shadow(0 0 4px rgba(0,150,255,0.8));
    }
    #specialGaugeUI {
      position: absolute; bottom: 14px; left: 20px; width: 160px;
      display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    .gauge-label { font-size: 10px; letter-spacing: 2px; color: rgba(200,150,255,0.7); text-transform: uppercase; }
    .gauge-bar-bg {
      width: 100%; height: 10px;
      background: rgba(150,0,255,0.1);
      border: 1px solid rgba(180,80,255,0.4);
      border-radius: 5px; overflow: hidden;
    }
    #gaugeBarFill {
      height: 100%; width: 58%;
      background: linear-gradient(90deg,#8800ff,#cc44ff);
      border-radius: 5px;
    }
    .gauge-hint { font-size: 10px; color: rgba(200,150,255,0.5); letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="canvas" width="480" height="680"></canvas>
    <div id="ui">
      <div class="ui-block">
        <div class="ui-label">スコア</div>
        <div class="ui-value">200</div>
      </div>
      <div class="level-badge">
        <div class="level-label">LEVEL</div>
        <div class="level-value">1</div>
      </div>
      <div class="ui-block" style="align-items:flex-end">
        <div class="ui-label">ライフ</div>
        <div class="lives-icons">
          <div class="life-icon"></div>
          <div class="life-icon"></div>
          <div class="life-icon"></div>
        </div>
      </div>
    </div>
    <div id="specialGaugeUI">
      <div class="gauge-label">SPECIAL GAUGE</div>
      <div class="gauge-bar-bg"><div id="gaugeBarFill"></div></div>
      <div class="gauge-hint">Z キーで発動</div>
    </div>
  </div>
  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = 480, H = 680;

    const nebulaGrad1 = (() => {
      const g = ctx.createRadialGradient(W * 0.3, H * 0.4, 0, W * 0.3, H * 0.4, 200);
      g.addColorStop(0, '#4400aa');
      g.addColorStop(1, 'transparent');
      return g;
    })();
    const nebulaGrad2 = (() => {
      const g = ctx.createRadialGradient(W * 0.7, H * 0.7, 0, W * 0.7, H * 0.7, 160);
      g.addColorStop(0, '#003388');
      g.addColorStop(1, 'transparent');
      return g;
    })();

    const stars = [
      [18,24,1.1,0.45],[52,68,0.7,0.35],[94,16,1.4,0.55],[138,92,0.9,0.4],[176,38,0.6,0.5],
      [218,74,1.2,0.42],[262,22,0.8,0.48],[304,58,1.0,0.38],[346,14,0.65,0.52],[388,82,1.3,0.36],
      [430,46,0.75,0.44],[462,96,1.1,0.4],[28,148,0.85,0.46],[72,188,1.2,0.38],[116,132,0.6,0.5],
      [158,172,1.0,0.42],[202,208,1.3,0.35],[246,152,0.9,0.48],[290,192,1.1,0.4],[334,236,0.7,0.52],
      [378,168,1.4,0.44],[422,212,0.8,0.38],[456,144,1.0,0.46],[36,268,0.65,0.42],[80,308,1.2,0.36],
      [124,348,0.9,0.5],[168,288,1.1,0.4],[212,328,0.75,0.48],[256,368,1.3,0.35],[300,308,0.85,0.44],
      [344,348,1.0,0.42],[388,388,0.6,0.5],[432,328,1.2,0.38],[468,368,0.9,0.46],[44,428,1.1,0.4],
      [88,468,0.7,0.52],[132,508,1.3,0.35],[176,448,0.85,0.48],[220,488,1.0,0.42],[264,528,0.75,0.44],
      [308,468,1.2,0.38],[352,508,0.9,0.5],[396,548,0.65,0.42],[440,488,1.1,0.46],[472,528,0.8,0.4],
      [24,588,1.0,0.44],[68,628,0.85,0.48],[112,568,1.2,0.36],[156,608,0.7,0.5],[200,648,1.3,0.38],
      [244,588,0.9,0.42],[288,628,1.1,0.44],[332,568,0.75,0.48],[376,608,1.0,0.4],[420,648,0.85,0.46],
    ];

    const player = { x: 240, y: H - 90, w: 36, h: 44 };

    // LEVEL 1 の2列6体配置から、中央付近を撃破した状態
    const enemies = [
      { x: 110, y: 86, w: 32, h: 28 },
      { x: 162, y: 82, w: 32, h: 28 },
      { x: 214, y: 88, w: 32, h: 28 },
      { x: 318, y: 84, w: 32, h: 28 },
      { x: 370, y: 90, w: 32, h: 28 },
      { x: 136, y: 142, w: 32, h: 28 },
      { x: 188, y: 138, w: 32, h: 28 },
      { x: 292, y: 144, w: 32, h: 28 },
      { x: 344, y: 140, w: 32, h: 28 },
    ];

    const bullets = [
      { x: 240, y: 542, w: 3, h: 12, color: '#00ccff' },
      { x: 240, y: 418, w: 3, h: 12, color: '#00ccff' },
      { x: 240, y: 286, w: 3, h: 12, color: '#00ccff' },
    ];

    const particles = [
      { x: 248, y: 102, r: 3.2, color: '#ffaa44', alpha: 0.92 },
      { x: 256, y: 108, r: 2.2, color: '#ffcc66', alpha: 0.85 },
      { x: 264, y: 98, r: 2.8, color: '#ff8844', alpha: 0.88 },
      { x: 272, y: 112, r: 2.0, color: '#ffdd88', alpha: 0.78 },
      { x: 280, y: 104, r: 3.0, color: '#ff9944', alpha: 0.9 },
      { x: 288, y: 110, r: 2.1, color: '#ffcc55', alpha: 0.72 },
      { x: 236, y: 106, r: 2.4, color: '#ffaa66', alpha: 0.82 },
      { x: 244, y: 114, r: 1.8, color: '#ff8844', alpha: 0.68 },
      { x: 252, y: 100, r: 2.6, color: '#ffbb55', alpha: 0.8 },
      { x: 268, y: 116, r: 2.0, color: '#ff7733', alpha: 0.75 },
    ];

    const scorePopups = [
      { x: 208, y: 58, val: 100 },
      { x: 286, y: 52, val: 100 },
    ];

    const powerup = { x: 252, y: 116, size: 11, label: 'MULTI', color: '#00ccff' };

    const enemyBullets = [
      { x: 198, y: 248, w: 4, h: 10, color: '#ff6644' },
      { x: 312, y: 272, w: 4, h: 10, color: '#ff6644' },
    ];

    function shadeColor(hex, amt) {
      const n = parseInt(hex.slice(1), 16);
      const r = Math.max(0, Math.min(255, (n >> 16) + amt));
      const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amt));
      const b = Math.max(0, Math.min(255, (n & 255) + amt));
      return `rgb(${r},${g},${b})`;
    }

    function drawBackground() {
      ctx.fillStyle = '#00000f';
      ctx.fillRect(0, 0, W, H);
      stars.forEach(([x, y, size, alpha]) => {
        ctx.globalAlpha = alpha;
        ctx.fillStyle = '#fff';
        ctx.fillRect(x | 0, y | 0, size, size);
      });
      ctx.globalAlpha = 1;
      ctx.save();
      ctx.globalAlpha = 0.04;
      ctx.fillStyle = nebulaGrad1;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = nebulaGrad2;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    function drawBasicEnemy(e) {
      const { x, y, w, h } = e;
      const fc = '#cc3333';
      ctx.save();
      const grad = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
      grad.addColorStop(0, fc);
      grad.addColorStop(1, shadeColor(fc, -40));
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(x, y + h / 2);
      ctx.lineTo(x + w / 2, y);
      ctx.lineTo(x + w * 0.3, y - h / 2);
      ctx.lineTo(x - w * 0.3, y - h / 2);
      ctx.lineTo(x - w / 2, y);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawPlayer() {
      const { x, y, w, h } = player;
      ctx.save();
      ctx.shadowColor = '#00ccff';
      ctx.shadowBlur = 16;
      ctx.fillStyle = 'rgba(0,150,255,0.72)';
      ctx.beginPath();
      ctx.ellipse(x, y + h * 0.45, 6, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
      const bg = ctx.createLinearGradient(x - w / 2, 0, x + w / 2, 0);
      bg.addColorStop(0, '#1a4a8a');
      bg.addColorStop(0.5, '#2266cc');
      bg.addColorStop(1, '#1a4a8a');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x + w / 2, y + h / 2 * 0.5);
      ctx.lineTo(x + w * 0.4, y + h / 2);
      ctx.lineTo(x - w * 0.4, y + h / 2);
      ctx.lineTo(x - w / 2, y + h / 2 * 0.5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#0f3070';
      ctx.beginPath();
      ctx.moveTo(x - w * 0.3, y);
      ctx.lineTo(x - w * 0.9, y + h * 0.4);
      ctx.lineTo(x - w * 0.35, y + h * 0.38);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + w * 0.3, y);
      ctx.lineTo(x + w * 0.9, y + h * 0.4);
      ctx.lineTo(x + w * 0.35, y + h * 0.38);
      ctx.closePath();
      ctx.fill();
      const cg = ctx.createRadialGradient(x, y - h * 0.1, 2, x, y - h * 0.1, 12);
      cg.addColorStop(0, 'rgba(255,220,120,0.95)');
      cg.addColorStop(0.45, 'rgba(150,220,255,0.85)');
      cg.addColorStop(1, 'rgba(0,80,200,0.4)');
      ctx.fillStyle = cg;
      ctx.beginPath();
      ctx.ellipse(x, y - h * 0.1, 8, 10, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawBullet(b) {
      ctx.save();
      const bx = (b.x - b.w / 2) | 0;
      const by = (b.y - b.h) | 0;
      ctx.fillStyle = b.color;
      ctx.fillRect(bx, by, b.w, b.h);
      ctx.fillStyle = 'rgba(180,235,255,0.5)';
      ctx.fillRect(bx + 1, by, Math.max(1, (b.w / 2) | 0), b.h);
      ctx.restore();
    }

    function drawEnemyBullet(b) {
      ctx.save();
      ctx.fillStyle = b.color;
      ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
      ctx.restore();
    }

    function drawPowerup(p) {
      ctx.save();
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = p.color;
      ctx.strokeStyle = 'rgba(255,255,255,0.8)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000';
      ctx.font = 'bold 6px Courier New';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.label, p.x, p.y);
      ctx.restore();
    }

    function drawScorePopups() {
      scorePopups.forEach(p => {
        ctx.fillStyle = '#ffcc00';
        ctx.font = 'bold 14px Courier New';
        ctx.textAlign = 'center';
        ctx.fillText(`+${p.val}`, p.x, p.y);
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    drawBackground();
    drawParticles();
    bullets.forEach(drawBullet);
    enemies.forEach(drawBasicEnemy);
    drawPowerup(powerup);
    enemyBullets.forEach(drawEnemyBullet);
    drawScorePopups();
    drawPlayer();
  </script>
</body>
</html>
